name: asa_stats
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 0.6.6+27

environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # STATE MANAGEMENT
  provider: ^6.0.3
  get_it: ^7.2.0

  # SERVICES
  flutter_svg: ^1.0.3
  intl: ^0.17.0
  fluttertoast: ^8.0.9
  flutter_screenutil: ^5.5.3+2
  flutter_sticky_header: ^0.6.4
  url_launcher: ^6.1.5
  scroll_to_index: any
  package_info_plus: ^1.0.6
  visibility_detector: ^0.2.2

  #Widgets
  flutter_zoom_drawer: ^3.0.3
  syncfusion_flutter_charts: 19.4.48+1
  flutter_inappwebview: 5.6.0
  flutter_easyloading: ^3.0.5
  expand_tap_area: ^1.1.0
  cached_network_image: ^3.3.1
  flutter_keyboard_visibility: ^5.0.0

  # DATA
  shared_preferences: ^2.0.15
  flutter_dotenv: ^5.0.2

  # NETWORKING
  dio: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

  flutter_launcher_icons: ^0.9.2
  # How to Use
  # flutter pub run flutter_launcher_icons:main

  flutter_native_splash: ^2.1.6
  # How to Use
  # flutter pub run flutter_native_splash:create

  change_app_package_name: ^1.0.0
  # How to Use
  # flutter pub run change_app_package_name:main com.new.package.name

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/language/
    - assets/json/
    - assets/provider/
    - .env
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
          # style: italic
          # weight: 700

# App icon
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: assets/icons/app_icon.png
  # adaptive_icon_background: "#FFFFFF"
  # remove_alpha_ios: true

# Splash screen
flutter_native_splash:

